[project]
name = "pbg-parsimony"
# The pre-rename dist name. This shim just depends on viva-parsimony so existing
# `pbg-parsimony` deps keep resolving. Import `viva_parsimony` (a `pbg_parsimony`
# import shim also ships in viva-parsimony). Keep the version in lockstep with
# viva-parsimony.
version = "0.1.0"
description = "Deprecated alias — renamed to 'viva-parsimony'. Depends on it so existing 'pbg-parsimony' deps keep resolving."
requires-python = ">=3.10"
dependencies = ["viva-parsimony>=0.1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pbg_parsimony_shim"]
