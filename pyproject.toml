[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "viva-parsimony"
version = "0.1.0"
description = "Reusable process-bigraph packing of 3D whole-cell structural models (parsimony engine wrapper)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "process-bigraph>=0.0.38",
    "bigraph-schema>=0.0.60",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/vivarium-collective/viva-parsimony"
Issues = "https://github.com/vivarium-collective/viva-parsimony/issues"

[tool.setuptools]
packages = ["viva_parsimony", "viva_parsimony.composites", "pbg_parsimony"]  # viva_parsimony real; pbg_parsimony = back-compat import shim

[tool.setuptools.package-data]
viva_parsimony = ["viewer/*", "composites/*.yaml"]

[project.scripts]
viva-parsimony-demo = "viva_parsimony.demo:main"
pbg-parsimony-demo = "viva_parsimony.demo:main"

[tool.uv.sources]
process-bigraph = { git = "https://github.com/vivarium-collective/process-bigraph.git", branch = "main" }
bigraph-schema = { git = "https://github.com/vivarium-collective/bigraph-schema.git", branch = "main" }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: slow end-to-end integration tests (network + OpenMM + parsimony CLI); excluded by default via -m 'not slow'",
]
