name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (parsimony CLI + OpenMM only needed for @slow real-relax/pack runs)
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest
      - name: Test (non-slow; validates the rename, shims, and pure recipe/structure logic)
        run: pytest -q
